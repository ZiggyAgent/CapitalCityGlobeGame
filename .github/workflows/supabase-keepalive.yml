name: Supabase Keep-Alive

# Keeps the Kids Games Supabase project active so the free tier doesn't auto-pause it.
#
# Supabase's actual bar (official docs): "a few user requests to the database
# each day over the previous week." So the ONLY thing that matters is frequent,
# DAILY activity — an every-2-3-day ping was always too sparse and the project
# paused despite green runs. This runs every 6 hours and makes a few real ANON
# requests each time (~12 DB requests/day, every day), and fails loud only if a
# whole run can't reach the project (i.e. it's down/paused).

on:
  schedule:
    - cron: '7 */6 * * *'   # every 6 hours (~4x/day x 3 pings = a dozen/day)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase as a normal (anon) client, a few times
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          ANON: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpkbWpmd3V1Z2Rka3l6c2F6d3pnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3ODA4NTYsImV4cCI6MjA5MjM1Njg1Nn0.G1HPQabERHzyQdvX66_r8Rj71MsflfQavUE76UrBJS4"   # public anon key (ships in the app client)
        run: |
          ok=0
          for i in 1 2 3; do
            RESP=$(curl -s -w "\n%{http_code}" \
              "$SUPABASE_URL/rest/v1/rpc/enter" \
              -X POST \
              -H "apikey: $ANON" -H "Authorization: Bearer $ANON" \
              -H "Content-Type: application/json" -H "Content-Profile: arcade" \
              -d '{"p_name": "__keepalive__", "p_pin": "0000", "p_create": false}')
            CODE=$(echo "$RESP" | tail -1); RESPBODY=$(echo "$RESP" | head -n -1)
            echo "ping $i: HTTP $CODE | $RESPBODY"
            if [ "$CODE" = "200" ] && echo "$RESPBODY" | grep -q '"ok"'; then ok=$((ok+1)); fi
            sleep 5
          done
          if [ "$ok" -eq 0 ]; then
            echo "::error::All keepalive pings failed — Kids Games Supabase may be DOWN or PAUSED. Unpause it in the dashboard."
            exit 1
          fi
          echo "$ok/3 pings OK — project is awake."
